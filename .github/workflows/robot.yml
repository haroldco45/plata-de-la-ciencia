name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/robot.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@users.noreply.github.com"
          git add noticias.json
          git diff --staged --quiet || (git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git push)
